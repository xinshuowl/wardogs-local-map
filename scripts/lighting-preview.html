<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>光照与材质验收</title>
<style>body{margin:0;background:#151b17;color:#eef2e8;font:15px system-ui}header{padding:16px 24px}p{margin:8px 0;color:#b9c6b8}canvas{display:block;width:100%;height:70vh}button{padding:8px 16px;margin-right:12px}#status{font:13px monospace}</style>
<header><strong>材质验收场景</strong><p>从左到右：玻璃与背后红柱、镂空铁丝网、金属球、砂石球、带透明背景的贴花。</p><button id="rotate">旋转视角</button><button id="shadows">切换阴影</button><p id="status">准备贴图与着色程序…</p></header>
<script type="module">
import * as THREE from '../vendor/three/three.module.js';
import { OrbitControls } from '../vendor/three/OrbitControls.js';
import { PropView } from '../prop-view.js';
import { TerrainEnvironment } from '../terrain-environment.js';
import { applySceneShadows, shadowFrame } from '../scene-shadows.js';
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth, innerHeight*.7); renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping; renderer.toneMappingExposure=.95;
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.append(renderer.domElement);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(42,innerWidth/(innerHeight*.7),.1,1000);
camera.position.set(0,6,15);
const controls=new OrbitControls(camera,renderer.domElement); controls.target.set(0,1,0); controls.update();
const sun=new THREE.DirectionalLight(); const distantSun=new THREE.DirectionalLight('#fff',0); const hemisphere=new THREE.HemisphereLight();
scene.add(sun,sun.target,distantSun,distantSun.target,hemisphere);
const terrain={scene,camera,controls,sun,distantSun,hemisphere,renderer,metresToWorld:1,renderProfile:'balanced',artilleryCameraMode:'orbit',invalidate(){},map:{id:'zestafona'}};
const environment=new TerrainEnvironment(terrain); terrain.environment=environment;
const scenes=await fetch('../assets/scene-manifest.json').then(response=>response.json()); environment.skyFor(scenes.zestafona.sky);
for(const [index,light] of [sun,distantSun].entries()) {
  const frame=shadowFrame(terrain,Boolean(index)); light.castShadow=true;
  light.position.copy(frame.position); light.target.position.copy(frame.target);
  Object.assign(light.shadow.camera,{left:-15,right:15,top:15,bottom:-15,near:.1,far:frame.far});
  light.shadow.mapSize.set(1024,1024); light.shadow.bias=-.00005; light.shadow.normalBias=.02; light.shadow.camera.updateProjectionMatrix();
}
const props=new PropView(terrain); terrain.props=props; props.base='../assets/models/zestafona/';
props.manifest=await fetch('../assets/models/zestafona/manifest.json').then(response=>response.json());
const read=props.read.bind(props); props.read=(url,...args)=>read(url.startsWith('assets/')?'../'+url:url,...args);
const glass=props.materialFor('MI_GlassDusty');
const wire=props.materialFor('MI_ChainLinkFence01a_Wire');
const decal=props.materialFor('MI_Dumpster_01_Decals');
const metal=props.materialFor('MI_CB_FrontTrays_01b');
const stone=applySceneShadows(new THREE.MeshStandardMaterial({color:'#a49780',roughness:.96}));
function add(geometry,material,position,cast=true) {
 const mesh=new THREE.Mesh(geometry,material); mesh.position.set(...position); mesh.castShadow=cast; mesh.receiveShadow=true; scene.add(mesh); return mesh;
}
add(new THREE.BoxGeometry(25,.2,12),applySceneShadows(new THREE.MeshStandardMaterial({color:'#b5b39c',roughness:.92})),[0,-.2,0]);
add(new THREE.BoxGeometry(1,2.8,1),applySceneShadows(new THREE.MeshStandardMaterial({color:'#c94336'})),[-5,1.4,-1]);
add(new THREE.PlaneGeometry(2.3,3.2),glass,[-5,1.6,.5],false);
add(new THREE.PlaneGeometry(2.3,3.2),wire,[-2.4,1.6,.5]);
add(new THREE.SphereGeometry(1,48,32),metal,[.4,1,0]);
add(new THREE.SphereGeometry(1,48,32),stone,[3,1,0]);
add(new THREE.BoxGeometry(2.3,3.2,.3),applySceneShadows(new THREE.MeshStandardMaterial({color:'#476a6b',roughness:.7})),[5.6,1.6,0]);
add(new THREE.PlaneGeometry(2.3,3.2),decal,[5.6,1.6,.17],false);
document.querySelector('#rotate').onclick=()=>{camera.position.x=camera.position.x?0:8;controls.update();};
document.querySelector('#shadows').onclick=()=>{renderer.shadowMap.enabled=!renderer.shadowMap.enabled;scene.traverse(object=>{if(object.material)object.material.needsUpdate=true;});};
function render() {
 props.shaderWarmup.update(); const upload=props.textureUploads.shift(); if(upload){renderer.initTexture(upload.texture);upload.apply();}
 controls.update(); renderer.render(scene,camera);
 const ready=!props.texturePending&&!props.textureUploads.length&&!props.shaderWarmup.pending;
 document.querySelector('#status').textContent=JSON.stringify({ready,glassOpacity:glass.opacity,glassDepthWrite:glass.depthWrite,wireCutout:wire.alphaTest,decalCutout:decal.alphaTest,metalness:metal.metalness,environment:Boolean(scene.environment)});
 requestAnimationFrame(render);
}
render();
</script>
</html>
